name: CI pipeline

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Verify Go version
        run: go version

      - name: Install dependencies
        run: go mod tidy

      - name: Build project
        run: go build ./...

      - name: Run health script (optional)
        run: |
          chmod +x scripts/*.sh
          ./scripts/start.sh || true
